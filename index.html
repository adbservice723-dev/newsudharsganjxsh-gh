<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}
  body{
    min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px;
    background:
      radial-gradient(circle at 50% 25%,rgba(26,148,255,.20),transparent 42%),
      radial-gradient(circle at 10% 90%,rgba(0,255,140,.10),transparent 38%),

  .chart-bg{position:fixed;inset:auto 0 0;height:25vh;opacity:.15;pointer-events:none;

  .bar{width:14px;height:var(--h);background:var(--c);border-radius:8px 8px 0 0}
  .card{width:min(100%,430px);padding:34px 24px 28px;border:1px solid rgba(118,255,188,.45);

    box-shadow:0 0 35px rgba(39,220,180,.10),inset 0 1px 0 rgba(255,255,255,.10);
    text-align:center;position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.05),transparent 45%,rgba(63,213,190,.04))}
  .logo{width:142px;height:142px;border-radius:50%;object-fit:cover;margin:0 auto 22px;
    border:3px solid transparent;background:linear-gradient(#13233b,#13233b) padding-box,
    linear-gradient(135deg,#55e7cc,#7a9dff,#ffd36b) border-box;
    box-shadow:0 0 24px rgba(85,231,204,.18)}
  .logo-placeholder{display:flex;align-items:center;justify-content:center;font-size:42px;
    font-weight:800;letter-spacing:1px;color:#a9ffe8;background:linear-gradient(135deg,#13233b,#223e62)}
  h1{font-size:clamp(15px,4.5vw,20px);line-height:1.18;margin:0 0 14px;font-weight:850;
    letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;text-wrap:nowrap}
  .official{display:inline-flex;align-items:center;gap:8px;padding:9px 19px;margin:0 auto 28px;
    border-radius:99px;border:1px solid rgba(94,237,197,.35);background:rgba(37,184,151,.12);
    color:#b8ffe7;font-size:13px;font-weight:800;letter-spacing:1.7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#56efb6;box-shadow:0 0 10px #56efb6}
  .join{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;
    padding:16px 20px;border-radius:20px;text-decoration:none;color:#07172a;
    font-size:19px;font-weight:850;letter-spacing:.2px;
    background:linear-gradient(115deg,#7af2dc,#65caff);box-shadow:0 10px 30px rgba(77,202,235,.25);
    transition:transform .15s ease,filter .15s ease}
  .join:hover{filter:brightness(1.07);transform:translateY(-2px)}
  .join:active{transform:scale(.98)}
  .telegram{width:26px;height:26px;fill:currentColor}
  .note{font-size:12px;color:rgba(218,231,250,.65);margin:18px 0 0;letter-spacing:.3px}
  .agency-footer{margin-top:24px;font-size:11px;letter-spacing:1px;color:rgba(218,231,250,.65)}
  .agency-footer a{color:#a8ffe5;text-decoration:none;font-weight:800}
  .agency-footer a:hover{text-decoration:underline}
  @media(max-height:700px){.card{padding:24px 20px}.logo{width:112px;height:112px;margin-bottom:16px}.official{margin-bottom:20px}.join{min-height:62px}}
